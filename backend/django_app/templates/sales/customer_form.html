{% extends "base/base.html" %}
{% block title %}{{ title }} - BizFlow{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header"><h1 class="page-title">{{ title }}</h1></div>
<div class="card form-narrow-container" style="max-width: 680px; margin: 0 auto 40px;">
  <form method="post" style="padding: 24px;">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">Customer Name *</label>
      {{ form.name }}
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
      <div class="form-group">
        <label class="form-label">Phone</label>
        {{ form.phone }}
      </div>
      <div class="form-group">
        <label class="form-label">PAN Number</label>
        {{ form.pan_number }}
      </div>
    </div>
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">Email</label>
      {{ form.email }}
    </div>
    <div class="form-group" style="margin-bottom:24px;">
      <label class="form-label">Address</label>
      {{ form.address }}
    </div>
    <div style="display:flex; gap:12px;">
      <button type="submit" class="btn btn-primary">Save Customer</button>
      <a href="{% url 'customers:list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
