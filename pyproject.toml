
[tool.pytest.ini_options]
# Tell pytest where to find Django settings
DJANGO_SETTINGS_MODULE = "config.settings.testing"
# Make pytest discover tests in these paths
testpaths = ["tests"]
# Add the Django app directory to sys.path so imports work
pythonpath = ["backend/django_app", "backend"]
# Verbose output by default
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
